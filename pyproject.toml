[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "read-assembler"
version = "1.0.0"
description = "Optimal short-read DNA assembler with per-read strand selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
read-assembler = "assembler.cli:main"

[tool.setuptools]
packages = ["assembler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
